<!DOCTYPE html>
<!-- ==========================================================================
     OLIVE BRANCH — NEW PAGE TEMPLATE
     Copy this file, rename it (e.g. about.html), then:
       1. Update <title> and the meta description
       2. Add the page to the `nav` array in js/site.config.js
       3. If the page needs its own styles, create css/pages/<name>.css
          and add an @import line at the bottom of css/main.css
     The nav, footer, buttons, type, and spacing all come along automatically.
     ========================================================================== -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page name — Olive Branch</title>
  <meta name="description" content="">

  <!-- Open Graph / social preview.
       og:image and og:url MUST be absolute — scrapers do not resolve
       relative paths. Update the domain here when the site moves off
       GitHub Pages to its real address. -->
  <meta property="og:title" content="Page name — Olive Branch">
  <meta property="og:description" content="">
  <meta property="og:image" content="https://brookerogersdesign.github.io/OliveBranch/assets/images/og/og-default.jpg">
  <meta property="og:url" content="https://brookerogersdesign.github.io/OliveBranch/newpage.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Olive Branch">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/logos/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png">

  <!-- Preload the one webfont so text paints without waiting for the
       CSS import chain to discover it -->
  <link rel="preload" href="assets/fonts/work-sans-var.woff2" as="font"
        type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <!-- Add the over-hero attribute only if this page opens with a
       full-bleed dark image behind the header. -->
  <site-nav></site-nav>

  <!-- Use --offset-header when the page does NOT open with a full-bleed hero,
       so the content clears the fixed header. -->
  <main id="main" class="site-main site-main--offset-header">

    <section class="section">
      <div class="container">
        <div class="section-head" data-reveal>
          <p class="eyebrow">Eyebrow</p>
          <h1>Page heading</h1>
          <p class="lede">A short introductory line.</p>
        </div>
      </div>
    </section>

  </main>

  <site-footer></site-footer>

  <script src="js/site.config.js"></script>
  <script src="js/icons.js"></script>
  <script src="components/site-nav.js"></script>
  <script src="components/site-footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- PLACEHOLDER PAGE — layout is real so the form styles are usable,
     but the copy and endpoint still need to be set. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Olive Branch</title>
  <meta name="description" content="">
  <!-- Open Graph / social preview.
       og:image and og:url MUST be absolute — scrapers do not resolve
       relative paths. Update the domain here when the site moves off
       GitHub Pages to its real address. -->
  <meta property="og:title" content="Contact — Olive Branch">
  <meta property="og:description" content="Start with a short conversation — no paperwork, no commitment.">
  <meta property="og:image" content="https://brookerogersdesign.github.io/OliveBranch/assets/images/og/og-default.jpg">
  <meta property="og:url" content="https://brookerogersdesign.github.io/OliveBranch/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Olive Branch">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/logos/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png">

  <!-- Preload the one webfont so text paints without waiting for the
       CSS import chain to discover it -->
  <link rel="preload" href="assets/fonts/work-sans-var.woff2" as="font"
        type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <site-nav></site-nav>

  <main id="main" class="site-main site-main--offset-header">
    <section class="section">
      <div class="container">
        <div class="split split--top">
          <div data-reveal>
            <p class="eyebrow">Contact</p>
            <h1>Get in touch</h1>
            <p class="lede">A line inviting people to reach out, and a note on
              how quickly they'll hear back.</p>
            <ul class="list-clean stack-sm mt-lg text-sm">
              <li><a class="link-underline" href="mailto:info@olivebranchacc.com">info@olivebranchacc.com</a></li>
            </ul>
          </div>

          <!-- Add action="https://…" once the form endpoint exists.
               Until then main.js shows a local success message. -->
          <form class="form" data-ob-form novalidate data-reveal data-reveal-delay="1">
            <div class="form__row form__row--2">
              <div class="field">
                <label class="field__label" for="firstName">First name</label>
                <input class="field__input" id="firstName" name="firstName" type="text" required>
              </div>
              <div class="field">
                <label class="field__label" for="lastName">Last name</label>
                <input class="field__input" id="lastName" name="lastName" type="text" required>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="email">Email</label>
              <input class="field__input" id="email" name="email" type="email" required>
            </div>

            <div class="field">
              <label class="field__label" for="subject">How can we help?</label>
              <select class="field__select" id="subject" name="subject">
                <option>General enquiry</option>
                <option>New project</option>
                <option>Something else</option>
              </select>
            </div>

            <div class="field">
              <label class="field__label" for="message">Message</label>
              <textarea class="field__textarea" id="message" name="message" required></textarea>
            </div>

            <label class="choice">
              <input type="checkbox" name="consent" required>
              <span>I agree to be contacted about this enquiry.</span>
            </label>

            <div class="cluster btn-group--stack-mobile">
              <button class="btn btn--primary" type="submit"><span class="btn__icon" data-icon="plus" aria-hidden="true"></span><span class="btn__label">Send Message</span></button>
            </div>

            <p class="form__status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="js/site.config.js"></script>
  <script src="js/icons.js"></script>
  <script src="components/site-nav.js"></script>
  <script src="components/site-footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
